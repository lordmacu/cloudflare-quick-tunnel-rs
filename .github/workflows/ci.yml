name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # ── Fast checks: fmt + clippy + build on the default toolchain ──────────────
  check:
    name: fmt + clippy + build (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: cargo build
        run: cargo build --all-targets

  # ── Unit tests across the platforms we ship for ─────────────────────────────
  test:
    name: test (${{ matrix.os }} / ${{ matrix.rust }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust: stable
          - os: ubuntu-latest
            rust: 1.86  # MSRV
          - os: macos-latest
            rust: stable
          - os: windows-latest
            rust: stable
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Note: no capnp install — bindings are pre-generated under
      # src/proto_gen/ and shipped with the crate.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      # macOS-latest runners ship a `rustup-init` proxy that the
      # PATH picks up before the freshly-installed toolchain on
      # some runner snapshots — `cargo test` resolves to the
      # bootstrapper and fails with "unexpected argument 'test'".
      # Forcing the toolchain default + sanity-checking with
      # `cargo --version` makes the failure show up at this step
      # with a clear error instead of mid-test, and on healthy
      # snapshots is a no-op.
      - name: Pin toolchain default (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          rustup default ${{ matrix.rust }}
          cargo --version
          rustc --version
      - name: Pin toolchain default (Windows)
        if: runner.os == 'Windows'
        run: |
          rustup default ${{ matrix.rust }}
          cargo --version
          rustc --version
        shell: pwsh
      - uses: Swatinem/rust-cache@v2
      - name: cargo test --lib
        run: cargo test --lib --all-features
      - name: cargo test --doc
        run: cargo test --doc --all-features

  # ── Cross-compile coverage for the targets nexo-rs ships ────────────────────
  cross:
    name: cross (${{ matrix.target }})
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-gnu
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross
        run: cargo install cross --locked
      - uses: Swatinem/rust-cache@v2
      - name: cargo build --target ${{ matrix.target }}
        run: cross build --target ${{ matrix.target }}
